name: Report a checker problem
description: Report an error, confusing result, or broken interaction.
title: "[Bug]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the result you expected and what the checker showed. Use the private review form on isthisleafygall.com to submit photos; do not post private photos or email addresses here.
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: e.g. Safari on iPhone, Chrome on Windows
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
