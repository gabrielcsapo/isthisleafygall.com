name: Checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run refs:validate
      - run: npm test
      - run: node --check dist/app.js && node --check dist/reviews.js && node --check dist/admin/admin.js && node --check dist/vision-worker.js && node --check server.mjs && node --check scripts/review-submissions.mjs
